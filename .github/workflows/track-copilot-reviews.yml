name: Track Copilot Reviews

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number in microsoft/vscode-pull-request-github
        required: true
        type: number

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/track_reviews.py "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlflow-db-pr-${{ inputs.pr_number }}
          path: ${{ github.workspace }}/mlflow.db
          if-no-files-found: error
